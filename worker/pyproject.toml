[project]
name = "agentcore-review-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "agentcore-review-shared",
    "temporalio[pydantic,strands-agents]==1.33.0",
    "strands-agents==1.57.0",
    # Pinned directly: the strands-agents[anthropic] extra caps anthropic below 1.0.
    "anthropic==1.8.0",
    "bedrock-agentcore==1.23.1",
    "boto3==1.43.103",
    "httpx2==2.13.1",
    # The requests extra: in 1.45 only a requests session (SigV4-signed here) can wrap the export call.
    "opentelemetry-exporter-otlp-proto-http[requests]==1.45.0",
    "regex==2026.9.10",
]

[tool.uv.sources]
agentcore-review-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "agentcore-review-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "agentcore-review-shared",
    "temporalio[pydantic]==1.33.0",
    "bedrock-agentcore==1.23.1",
    "boto3==1.43.103",
]

[tool.uv.sources]
agentcore-review-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

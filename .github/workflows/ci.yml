name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - run: uv sync --all-packages --locked
      - run: make check

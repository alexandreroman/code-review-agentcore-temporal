# Planted defects of the "Add customer search & order history" scenario in
# the agentcore-review-demo-app repository (tag scenario/customer-search).
#
# E2E-04 matches them against the findings returned by the three round-1
# reviewer child workflows of a pull request opened from
# feature/customer-search. A defect is found when one finding has its
# category, its file as path, and a span [line, end_line or line] that
# overlaps one of its line ranges (inclusive). Line numbers refer to the
# file at the scenario tag (RIGHT side of the diff). The missing tests of
# the new endpoints are part of the maintainability defect but have no line
# to anchor, so they are not matched.
defects:
  - id: sql-injection
    category: security
    file: src/main/java/com/example/orders/CustomerController.java
    line_ranges: [[41, 46]]
    summary: Customer search SQL built by string concatenation and run through JdbcClient
  - id: n-plus-one
    category: performance
    file: src/main/java/com/example/orders/CustomerController.java
    line_ranges: [[61, 64]]
    summary: Order history loads each order's lines with one findByOrderId query per order
  - id: duplicated-validation
    category: maintainability
    file: src/main/java/com/example/orders/CustomerController.java
    line_ranges: [[35, 40], [52, 57]]
    summary: Identical page/size checks in both endpoints, and no tests

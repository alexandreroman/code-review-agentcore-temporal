<!DOCTYPE html>
<html lang="en" class="h-full" style="background:#0C0A1B">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Review with AgentCore x Temporal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
          integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
          crossorigin="anonymous"></script>
  <script>
    document.addEventListener("alpine:init", () => {
      Alpine.data("dashboard", () => ({
        status: null, etag: null, timer: null, reachable: true,
        init() {
          this.refresh();
          document.addEventListener("visibilitychange", () => { if (!document.hidden) this.refresh(); });
        },
        async refresh() {
          clearTimeout(this.timer);
          let delay = 15000;
          try {
            const response = await fetch("dashboard.json");
            if (!response.ok) throw new Error(response.status);
            this.reachable = true;
            const etag = response.headers.get("ETag");
            if (etag !== this.etag) {
              const previous = this.figures();
              this.status = await response.json();
              this.etag = etag;
              this.glow(previous);
            }
          } catch {
            this.reachable = false;
            delay = 60000;
          }
          if (!document.hidden) this.timer = setTimeout(() => this.refresh(), delay);
        },
        notice() {
          if (!this.reachable) return "Status unreachable — retrying…";
          if (!this.status) return null;
          if (!this.status.deployed) return "Not deployed yet — run make up.";
          if (!this.status.sessions || !this.status.reviews) return "Temporal unavailable — retrying…";
          return null;
        },
        // A changed figure glows briefly in lime; a figure shown for the first time, or turned to "—", does not.
        glow(previous) {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          this.$nextTick(() => {
            const values = this.$root.querySelectorAll("[data-figure-value]");
            this.figures().forEach((figure, i) => {
              const before = previous[i].value;
              if (before == null || figure.value == null || before === figure.value) return;
              values[i].animate(
                [{ color: "#B6F35A", textShadow: "0 0 18px rgba(182, 243, 90, .6)" }, { textShadow: "none" }],
                { duration: 900, easing: "ease-out" },
              );
            });
          });
        },
        figures() {
          return [
            { label: "AgentCore sessions", value: this.status?.sessions?.active },
            { label: "Reviews in progress", value: this.status?.reviews?.running },
            { label: "Agents at work", value: this.status?.reviews?.agents_running },
            { label: "Reviews done · 24\u00a0h", value: this.status?.reviews?.completed_24h },
          ];
        },
      }));
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"

  <style type="text/tailwindcss">
    @theme {
      --font-display: "Space Grotesk", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --color-violet: #8B5CF6;
      --color-lime: #B6F35A;
      --color-slateb: #7C8FB1;
    }
  </style>
  <style>
    body {
      background:
        radial-gradient(1200px 500px at 70% -10%, #3B2E8F55, transparent 60%),
        radial-gradient(900px 600px at 10% 0%, #201457, transparent 55%),
        #0C0A1B;
      background-attachment: fixed;
    }
    .grid-overlay {
      position: fixed; inset: 0; pointer-events: none;
      background-image: linear-gradient(#ffffff0a 1px, transparent 1px),
        linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: linear-gradient(180deg, #000, transparent 55%);
      mask-image: linear-gradient(180deg, #000, transparent 55%);
    }
    .title-gradient {
      background-image: linear-gradient(90deg, #8B5CF6, #5B7CFA, #B6F35A, #5B7CFA, #8B5CF6);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: title-shift 6s linear infinite;
    }
    @keyframes title-shift { to { background-position: -200% center; } }
    @media (prefers-reduced-motion: reduce) { .title-gradient { animation: none; } }
    .arch text { text-anchor: middle; }
    .arch .node { fill: #15122B; stroke: rgba(255, 255, 255, .16); stroke-width: 1; }
    .arch .node-violet { fill: rgba(139, 92, 246, .14); stroke: #8B5CF6; }
    .arch .node-lime { fill: rgba(182, 243, 90, .07); stroke: rgba(182, 243, 90, .6); }
    .arch .node-title { font: 600 13px "Space Grotesk", sans-serif; fill: #F5F5F5; }
    .arch .node-sub { font: 10.5px "IBM Plex Mono", monospace; fill: #7C8FB1; }
    .arch .zone { fill: none; stroke: rgba(124, 143, 177, .35); stroke-dasharray: 4 4; }
    .arch .zone-lime { stroke: rgba(182, 243, 90, .35); }
    .arch .zone-aws { stroke: rgba(255, 153, 0, .55); fill: rgba(255, 153, 0, .03); transition: stroke .3s ease; }
    /* A dash a tenth of the perimeter long (pathLength 1000) that loops around the AWS account border. */
    .arch .zone-run {
      fill: none; stroke: #FFC266; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100 900;
      filter: url(#glow-aws); pointer-events: none; opacity: 0; transition: opacity .3s ease;
      animation: zone-run 3s linear infinite paused;
    }
    /* Hovering the AWS account tag (logo and label) runs the light and brightens the border. */
    .arch:has(.aws-tag:hover) .zone-run { opacity: 1; animation-play-state: running; }
    .arch:has(.aws-tag:hover) .zone-aws { stroke: rgba(255, 153, 0, .85); }
    .arch .aws-tag-hit { fill: transparent; }
    @keyframes zone-run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .arch .zone-run { display: none; } }
    .arch .zone-label {
      font: 9px "IBM Plex Mono", monospace; letter-spacing: .15em; text-transform: uppercase; fill: #7C8FB1;
      text-anchor: start;
    }
    .arch .zone-label-lime { fill: rgba(182, 243, 90, .75); }
    .arch .zone-label-aws { fill: #FFB547; }
    .arch .edge { fill: none; stroke: #7C8FB1; stroke-width: 1.25; }
    .arch .edge-lime { stroke: #B6F35A; }
    .arch .edge-violet { stroke: #8B5CF6; stroke-dasharray: 4 4; }
    /* A stroke in the card colour behind each label keeps crossing lines off the text. */
    .arch .edge-label {
      font: 10px "IBM Plex Mono", monospace; fill: #A3AFC6;
      paint-order: stroke; stroke: #110E22; stroke-width: 5px; stroke-linejoin: round;
    }
    .arch .edge-label-lime { fill: #B6F35A; }
    .arch .edge-label-violet { fill: #A78BFA; }
    .arch .label-start { text-anchor: start; }
    .arch .icon { fill: #fff; }
    .arch .icon-lime { fill: rgba(182, 243, 90, .75); }
    .arch .icon-aws { fill: #FF9900; }
    /* Only the components that start a flow are focusable, and react to hover. */
    .arch .node-g[tabindex] { cursor: pointer; outline: none; }
    .arch .node-g .node { transition: stroke .2s ease; }
    .arch .node-g[tabindex]:hover .node, .arch .node-g:focus-visible .node { stroke: rgba(255, 255, 255, .45); }
    .arch .node-g[tabindex]:hover .node-violet, .arch .node-g:focus-visible .node-violet { stroke: #A78BFA; }
    .arch .node-g[tabindex]:hover .node-lime, .arch .node-g:focus-visible .node-lime { stroke: #B6F35A; }
    .arch .edge, .arch .edge-label { transition: stroke .2s ease, stroke-width .2s ease, opacity .25s ease; }
    /* While a flow plays, the other links and labels step back and the active one comes forward. */
    .arch.flowing .edge, .arch.flowing .edge-label { opacity: .25; }
    .arch.flowing .edge.active, .arch.flowing .edge-label.active { opacity: 1; }
    .arch .edge.active { stroke: #F5F5F5; stroke-width: 2; }
    .arch .edge-lime.active { stroke: #D9FF9E; }
    .arch .edge-violet.active { stroke: #C4B5FD; }
    /* The pulse: a white dash with a lime halo that the script moves along its edge; hidden between runs. */
    .arch .pulse {
      fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; filter: url(#glow); opacity: 0;
      pointer-events: none;
    }
    /* The component the pulse reaches lights up for a moment. */
    @keyframes node-hit { 0% { stroke: #B6F35A; stroke-width: 2.5; } 100% { stroke-width: 1; } }
    .arch .node-g.hit .node { animation: node-hit 650ms ease-out; }
    [x-cloak] { display: none !important; }
  </style>
</head>

  <script type="module">
    // Hovering a component replays its links in the order of the flow, in a loop until the pointer leaves. Every pulse
    // follows its arrow. The worker's single GitHub step stands for both calls, the source and the review.
    const FLOWS = {
      github: ["webhook"],
      router: ["signal"],
      temporal: ["start"],
      worker: ["github", "snapshot", "llm"],
    };
    // The component each edge leads to: it lights up when the pulse reaches it.
    const TARGETS = {
      webhook: "router",
      signal: "temporal",
      start: "worker",
      llm: "claude",
      snapshot: "s3",
      github: "github",
    };
    const PULSE = 44, SPEED = 0.3, PAUSE = 220, LOOP_PAUSE = 800;  // dash length, px per ms, ms between steps and loops
    const reduced = matchMedia("(prefers-reduced-motion: reduce)");
    const svg = document.querySelector("svg.arch");
    let run = 0, running = null, playing = null;

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const lit = (name) => svg.querySelectorAll(`[data-edge="${name}"], [data-for="${name}"]`);

    function hit(node) {
      const group = svg.querySelector(`[data-node="${node}"]`);
      group.classList.remove("hit");
      void group.getBBox();  // restarts the animation when the same node is hit twice in a row
      group.classList.add("hit");
    }

    async function pulse(name, token) {
      const path = svg.querySelector(`[data-pulse="${name}"]`);
      const length = path.getTotalLength();
      lit(name).forEach((el) => el.classList.add("active"));
      if (reduced.matches) {
        await sleep(700);
      } else {
        // A dash of PULSE px followed by a gap as long as the path: only one dash is ever visible.
        path.style.strokeDasharray = `${PULSE} ${length}`;
        const frames = [{ strokeDashoffset: PULSE, opacity: 1 }, { strokeDashoffset: -length, opacity: 1 }];
        running = path.animate(frames, {
          duration: Math.max(900, length / SPEED), easing: "ease-in-out",
        });
        await running.finished.catch(() => {});
      }
      if (token !== run) return;
      hit(TARGETS[name]);
      lit(name).forEach((el) => el.classList.remove("active"));
    }

    // A click fires focus after pointerenter: the flow already playing goes on rather than restarting.
    async function play(node) {
      if (node === playing) return;
      stop();
      playing = node;
      const token = ++run;
      svg.classList.add("flowing");
      while (token === run) {
        for (const name of FLOWS[node]) {
          if (token !== run) return;
          await pulse(name, token);
          await sleep(PAUSE);
        }
        await sleep(LOOP_PAUSE);
      }
    }

    function stop() {
      run++;
      playing = null;
      running?.cancel();
      svg.classList.remove("flowing");
      svg.querySelectorAll(".active, .hit").forEach((el) => el.classList.remove("active", "hit"));
    }

    svg.querySelectorAll(".node-g[tabindex]").forEach((group) => {
      group.addEventListener("pointerenter", () => play(group.dataset.node));
      group.addEventListener("pointerleave", stop);
      group.addEventListener("focus", () => play(group.dataset.node));
      group.addEventListener("blur", stop);
    });
  </script>
